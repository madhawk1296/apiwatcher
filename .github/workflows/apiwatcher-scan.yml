### Reusable scan workflow.
#
# Customers reference this from their own repo (see templates/apiwatcher.yml), so
# the scan runs on their runner with their token. Their code never leaves their
# infrastructure and the compute costs us nothing.
name: apiwatcher scan

on:
  workflow_call:
    inputs:
      target:
        description: 'Stripe API version to check against, or "latest".'
        type: string
        required: false
        default: latest
      fail-on:
        description: 'Severity that fails the job: breaking | deprecating | additive | never.'
        type: string
        required: false
        default: breaking
      open-issue:
        description: 'Open or update a tracking issue when something breaks.'
        type: boolean
        required: false
        default: true
      working-directory:
        description: 'Subdirectory to scan.'
        type: string
        required: false
        default: '.'
      apiwatcher-version:
        description: 'Version of the apiwatcher CLI to run.'
        type: string
        required: false
        default: latest

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan for affected Stripe call sites
        id: scan
        working-directory: ${{ inputs.working-directory }}
        # The CLI exits 1 when it finds something at or above --fail-on, which is
        # the signal we want, not a workflow error — so capture it.
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
          FAIL_ON: ${{ inputs.fail-on }}
          CLI_VERSION: ${{ inputs.apiwatcher-version }}
        run: |
          set -o pipefail
          npx --yes "apiwatcher-cli@${CLI_VERSION}" scan . \
            --target "${TARGET}" \
            --fail-on "${FAIL_ON}" \
            --format md \
            --out "${RUNNER_TEMP}/apiwatcher-report.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish report to the job summary
        run: cat "${RUNNER_TEMP}/apiwatcher-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: inputs.open-issue && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="apiwatcher"
          TITLE="Stripe API changes affect this repository"

          # One label-scoped issue, updated in place. A new issue per run would
          # be noise; a new comment per run buries the current state.
          if ! gh label list --repo "$REPO" --json name -q '.[].name' | grep -qx "$LABEL"; then
            gh label create "$LABEL" --repo "$REPO" \
              --description "Opened by apiwatcher" --color ededed || true
          fi

          BODY_FILE="${RUNNER_TEMP}/issue-body.md"
          cp "${RUNNER_TEMP}/apiwatcher-report.md" "$BODY_FILE"
          {
            echo
            echo "---"
            echo
            echo "[Full run]($RUN_URL) · updated automatically by [apiwatcher](https://github.com/madhawk1296/apiwatcher)."
            echo "Silence a false positive by adding its \`id\` to \`ignoreChanges\` in \`.apiwatcher.json\`."
          } >> "$BODY_FILE"

          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --json number -q '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label "$LABEL" --body-file "$BODY_FILE"
          fi

      - name: Close the tracking issue when nothing is affected
        if: inputs.open-issue && steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --label apiwatcher --state open \
            --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "No Stripe changes affect this repository any more. Closing." || true
          fi

      - name: Fail the job if the scan found something
        if: steps.scan.outcome == 'failure'
        run: |
          echo "apiwatcher found changes at or above the '${{ inputs.fail-on }}' threshold." >&2
          echo "See the job summary for the report." >&2
          exit 1
