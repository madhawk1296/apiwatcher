name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build
        run: |
          npm run build --workspace apiwatcher-cli
          npm run build --workspace @apiwatcher/server

      - name: Test
        run: npm test --workspaces --if-present

      - name: Scan the fixture repo end to end
        run: |
          # The fixture passes a parameter that Stripe removed, so the scan must
          # exit 1. A 0 here means the detection pipeline silently stopped working.
          if node packages/apiwatcher/dist/cli/index.js scan \
               packages/apiwatcher/test/fixtures/sample-app --no-color; then
            echo "Expected the fixture scan to report a breaking change." >&2
            exit 1
          fi

      - name: Server fails fast on missing config
        run: |
          # A misconfigured deploy must die in the first second with a clear
          # message, not on the first webhook.
          set +e
          out=$(node packages/server/dist/index.js 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "expected a non-zero exit without APP_ID" >&2; exit 1; }
          echo "$out" | grep -q "Missing required environment variable APP_ID"
