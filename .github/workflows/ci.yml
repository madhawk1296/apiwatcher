name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Build
        run: npm run build --workspace apimigrate

      - name: Typecheck the worker
        run: npm run typecheck --workspace @apimigrate/github-app

      - name: Test
        run: npm test --workspaces --if-present

      - name: Scan the fixture repo end to end
        run: |
          # The fixture passes a parameter that Stripe removed, so the scan must
          # exit 1. A 0 here means the detection pipeline silently stopped working.
          if node packages/apimigrate/dist/cli/index.js scan \
               packages/apimigrate/test/fixtures/sample-app --no-color; then
            echo "Expected the fixture scan to report a breaking change." >&2
            exit 1
          fi
