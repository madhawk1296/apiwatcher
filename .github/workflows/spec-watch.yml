### The spec watcher.
#
# Runs in this repo on a cron, so the whole "notice a new Stripe version" half of
# the product costs nothing: GitHub Actions on a public repo is free, and the job
# exits in seconds on the overwhelming majority of runs where nothing changed.
name: spec watch

on:
  schedule:
    # Daily. Stripe ships dated versions far less often than this, so almost
    # every run is a no-op.
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      to-ref:
        description: 'stripe/openapi ref to diff up to.'
        required: false
        default: master

permissions:
  contents: write
  issues: write

concurrency:
  group: spec-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build --workspace apiwatcher

      - name: Diff Stripe's spec forward
        id: watch
        env:
          # Raises the GitHub API rate limit for the commit lookup.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --max-old-space-size=6144 \
            packages/apiwatcher/dist/cli/index.js watch \
            --to-ref "${{ github.event.inputs.to-ref || 'master' }}"

      - name: Commit the new changeset
        if: steps.watch.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.watch.outputs.new_version }}
          BREAKING: ${{ steps.watch.outputs.breaking }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Watcher reported $NEW_VERSION but produced no file changes; nothing to commit."
            exit 0
          fi

          git config user.name 'apiwatcher-bot'
          git config user.email 'apiwatcher-bot@users.noreply.github.com'
          git add changesets packages/apiwatcher/data
          git commit -m "Stripe ${NEW_VERSION}: ${BREAKING} breaking change(s)

          Generated by \`apiwatcher watch\`. Review before relying on it —
          rename detection is heuristic and the notes are not hand-checked yet."
          git push

      - name: Flag the new version for review
        if: steps.watch.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.watch.outputs.new_version }}
          BREAKING: ${{ steps.watch.outputs.breaking }}
        run: |
          set -euo pipefail
          # Hand-verify early versions before trusting the automation: a wrong
          # `replacement` sends every customer to the wrong field.
          gh label create changeset-review --description "A generated changeset awaiting review" --color d93f0b 2>/dev/null || true
          gh issue create \
            --title "Review changeset for Stripe ${NEW_VERSION}" \
            --label "changeset-review" \
            --body "\`apiwatcher watch\` published a changeset for **${NEW_VERSION}** with **${BREAKING}** breaking change(s).

          Before the GitHub App fans this out to installed repos, check:

          - [ ] Removed endpoints really are gone (not just moved).
            - [ ] Renames point at the right replacement field.
            - [ ] \`required\` notes name the correct conditional parent.
            - [ ] Nothing obviously additive is marked breaking.

            The App reads \`changesets/stripe/index.json\`, so it will pick this up on its next cron." \
            || echo "Could not open the review issue; continuing."
